<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-bottom)` mean
      anything: without it the browser letterboxes the layout and every
      `pb-safe` in the app resolves to zero, so the bottom bar sits under the
      iOS home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>StudyForge</title>
    <meta
      name="description"
      content="StudyForge turns your classes, chapters and notes into practice questions, timed tests and analytics that show where the gaps are."
    />
    <meta property="og:title" content="StudyForge" />
    <meta
      property="og:description"
      content="StudyForge turns your classes, chapters and notes into practice questions, timed tests and analytics that show where the gaps are."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://caffeine.ai/imgs/share-logo.jpeg"
    />
    <meta property="og:image:alt" content="StudyForge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://caffeine.ai/imgs/share-logo.jpeg"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ac4500" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StudyForge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Restore the saved theme before first paint so there is no flash. A file
      rather than an inline block: the production Content-Security-Policy grants
      no `'unsafe-inline'` to scripts, so an inline block here would be blocked
      and the app would flash the wrong theme on every dark-mode visit.
    -->
    <!-- The pre-JS boot shell recolours per theme through the classes
         theme-bootstrap.js just set — literal oklch values because the
         token stylesheet arrives with the bundle in dev. -->
    <style>
      /* Default palette inline in the style attribute would beat these rules,
         so the light colours live here too and the theme blocks override. */
      #boot-shell {
        background: oklch(0.972 0.045 93);
        color: oklch(0.3 0.055 55);
      }
      html.dark #boot-shell {
        background: oklch(0.24 0.02 262);
        color: oklch(0.94 0.012 120);
      }
      html.frosted #boot-shell {
        background: oklch(0.958 0.024 152);
        color: oklch(0.3 0.055 165);
      }
      html.maroon #boot-shell {
        background: oklch(0.9809 0.0109 54.4);
        color: oklch(0.27 0.05 18);
      }
    </style>
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <!--
        The whole app is a React bundle, so with JavaScript off `#root` stays an
        empty box and the visitor gets a blank page with no explanation. This is
        the only content that can promise to be seen: the browser renders it and
        nothing else.
      -->
      <noscript>
        <h1>StudyForge needs JavaScript</h1>
        <p>
          StudyForge runs entirely in this browser — it reads your documents,
          builds practice questions and tracks your progress as you use it — so
          nothing of the app can be shown with JavaScript turned off. Enable
          JavaScript for this site, or open it in a browser that has JavaScript
          enabled, and reload this page.
        </p>
      </noscript>
      <div
        id="boot-shell"
        style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"
      >
        <span style="font-family:Georgia,serif;font-size:22px;font-weight:600;font-style:italic">StudyForge</span>
        <span style="font-size:13px;opacity:0.7">Loading your workspace…</span>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
