name: canister-build

# Builds the Motoko backend with the toolchain pinned in mops.toml (moc
# 1.16.0), boots the produced wasm on PocketIC, and drives the backend test
# lane (test/pocketic/backend.test.ts) against it — the same gate the local
# Docker toolchain runs. The wasm is uploaded as an artifact only if the lane
# is green, so the artifact always represents a lane-tested build.
#
# The lane attaches to a PocketIC sidecar (docker/pocketic-sidecar.mjs): a
# wrapper answering /healthz and /descriptor in front of the pocket-ic server
# that mops installs as a pinned toolchain. The lane never starts a replica of
# its own — locally it skips without POCKETIC_SIDECAR_URL, in CI this workflow
# is what hosts one.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: canister-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mops
        run: npm install -g ic-mops@latest

      - name: Resolve packages
        run: mops install

      # mops check's stable-interface step compares the new interface against a
      # previous .most snapshot at .old/src/backend/dist/. No dist artifact is
      # committed (dist/ is gitignored), so CI uses mops's own documented
      # empty-actor baseline: the check then proves the interface is valid as a
      # first deploy. The upgrade-compare against the actually-deployed
      # interface happens where the deployment happens.
      - name: Provide the empty-actor stable baseline
        run: |
          mkdir -p .old/src/backend/dist
          printf '// Version: 1.0.0\nactor { }\n' > .old/src/backend/dist/backend.most

      - name: Typecheck
        run: mops check

      # `tee` rather than a bare run, and the error step below, exist because
      # the job log itself is not readable from outside GitHub: the API's log
      # endpoint answers 403 "Must have admin rights to Repository" even on a
      # public repo, so a red step that only prints "Process completed with
      # exit code 1" in its annotation is undiagnosable from where this project
      # is developed (no moc on Windows, no WSL distro, so no local compile
      # either). A `::error::` annotation is the one channel that does reach
      # the REST API, so the compiler's own words go through it.
      - name: Build
        shell: bash
        run: set -o pipefail && mops build 2>&1 | tee /tmp/mops-build.log

      - name: Surface the build error
        if: failure()
        shell: bash
        run: |
          [ -s /tmp/mops-build.log ] || { echo "::error::mops build produced no output"; exit 0; }
          # One annotation per line, with the characters workflow commands use
          # as their own delimiters escaped back, so the message survives.
          tail -n 40 /tmp/mops-build.log | while IFS= read -r line; do
            line="${line//%/%25}"
            line="${line//$'\r'/%0D}"
            line="${line//$'\n'/%0A}"
            echo "::error::${line}"
          done

      # The lane's dependencies (vitest from src/frontend, @dfinity/pic from
      # the root) are resolved by a workspace pnpm install. It must come AFTER
      # the build: the lane refuses a stale wasm, and the install must not be
      # able to make src/ newer than dist/.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install lane dependencies
        run: pnpm install --prefer-offline

      - name: Start the PocketIC sidecar
        shell: bash
        run: |
          BIN="$(find "$HOME/.cache/mops" "$HOME/.mops" -type f -name 'pocket-ic*' -perm -u+x 2>/dev/null | head -n 1 || true)"
          if [ -z "$BIN" ]; then
            echo "::error::pocket-ic binary not found under $HOME/.cache/mops or $HOME/.mops"
            exit 1
          fi
          echo "Using pocket-ic at $BIN"
          POCKET_IC_BIN="$BIN" nohup bash docker/sidecar-entrypoint.sh > /tmp/sidecar.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz 2>/dev/null | grep -q '"ok":true'; then
              echo "sidecar healthy on :8090"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::the sidecar did not become healthy in 30s"
          tail -n 20 /tmp/sidecar.log | while IFS= read -r line; do
            echo "::error::sidecar: ${line}"
          done
          exit 1

      - name: Backend lane
        shell: bash
        run: set -o pipefail && POCKETIC_SIDECAR_URL=http://127.0.0.1:8090 pnpm test:backend 2>&1 | tee /tmp/lane.log

      - name: Surface the lane error
        if: failure()
        shell: bash
        run: |
          [ -s /tmp/lane.log ] || { echo "::error::backend lane produced no output"; exit 0; }
          tail -n 40 /tmp/lane.log | while IFS= read -r line; do
            line="${line//%/%25}"
            line="${line//$'\r'/%0D}"
            line="${line//$'\n'/%0A}"
            echo "::error::${line}"
          done

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: backend-wasm
          path: src/backend/dist/backend.wasm
          if-no-files-found: error
